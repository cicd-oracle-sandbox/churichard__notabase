name: unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - name: Persist credentials
        run: |
          export NEXT_PUBLIC_SUPABASE_URL=https://your-supabase-url.supabase.co
          export NEXT_PUBLIC_SUPABASE_KEY=your-supabase-key
          export SUPABASE_SERVICE_KEY=your-supabase-service-key
